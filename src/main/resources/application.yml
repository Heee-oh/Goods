spring:
  application:
    name: market

  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: jdbc:postgresql://localhost:5433/goods
    username: user
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.goods.market.listing.application.dto, com.goods.market.member
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

app:
  storage:
    base-dir: uploads

jwt:
  secret: seg$#%3452FGFRdsrgd@#$44ZA4343Fh45346Ed3@sagggGGde@dE5tgHiL
  access-token-validity-seconds: 3600
